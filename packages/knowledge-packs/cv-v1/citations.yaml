BRUYNINCKX_2008:
  type: SYSTEMATIC_REVIEW
  title: "Signs and symptoms in diagnosing acute myocardial infarction and acute coronary syndrome: a diagnostic meta-analysis"
  authors: "Bruyninckx R, Aertgeerts B, Bruyninckx P, Buntinx F"
  year: 2008
  doi: "10.3399/bjgp08X277014"
  evidence_grade: B
  table_or_figure: "Appendix 6 (pooled sens/spec/LR+/LR- for ACS, non-selected patient group)"
  extracted_by: "Claude (AI-assisted extraction, pending human verification)"
  extracted_on: "2026-08-08"
  checked_by: null
  notes: >
    Diagnostic meta-analysis, 28 studies, MEDLINE/EMBASE/CINAHL to May 2006.
    Reports pooled sens/spec/LR+/LR- separately for AMI and ACS (=AMI+UA)
    outcomes, and separately for "non-selected" (GP/paramedic/ED-recruited,
    closer to undifferentiated) vs "selected" (coronary care unit/cardiologist
    -recruited) populations. Non-selected/ACS values used here as closest
    population match to this project's ED_UNDIFFERENTIATED_CHEST_PAIN prior.
    IMPORTANT SCOPE CAVEAT: "ACS" as defined by this paper = AMI + unstable
    angina combined. Extracted LRs are for "has ACS", not "has UA
    specifically" -- a genuine scope broadening versus this project's
    UNSTABLE_ANGINA-only hypothesis. No source found (paywalled or
    unavailable) that isolates UA-only diagnostic accuracy for these
    findings; this is the best available proxy. Flagged prominently in
    EXTRACTION_NOTES. Many findings (back pain, epigastric pain, sweating,
    nausea) excluded from extraction due to I-squared >85% (unstable pooled
    estimates) or LR+ confidence interval crossing 1.0 (epigastric pain --
    not statistically distinguishable from no effect). Free full text:
    https://bjgp.org/content/58/547/e1 (BJGP, PMC2233977).

