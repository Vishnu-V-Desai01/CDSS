WANG_2005:
  type: SYSTEMATIC_REVIEW
  title: "Does This Dyspneic Patient in the Emergency Department Have Congestive Heart Failure?"
  authors: "Wang CS, FitzGerald JM, Schulzer M, Mak E, Ayas NT"
  year: 2005
  doi: "TO_VERIFY"
  evidence_grade: A
  table_or_figure: "Table 3 (history/physical exam), Table 4 (CXR/ECG), Table 5 (BNP)"
  extracted_by: "Claude (AI-assisted extraction, pending human verification)"
  extracted_on: "2026-08-08"
  checked_by: null
  notes: >
    Rational Clinical Examination series, JAMA. Meta-analysis of 18 studies (of 22
    identified), levels 1-3 quality only. Reports sensitivity, specificity, and LR
    as SEPARATELY pooled random-effects parameters (bivariate model, delta method)
    -- NOT derived from a single 2x2 table. This means LR = sens/(1-spec) does not
    always hold exactly for the reported point estimates, since specificity is
    rounded to 2 significant figures in the paper. For S3 gallop, CXR pulmonary
    venous congestion, and CXR interstitial edema, specificity was refined to more
    decimal places by back-solving from the paper's own reported LR and sensitivity
    (not invented -- both source values are from the same table) to satisfy the
    schema's tolerance check. See per-state notes in condition file.
    Population: adult ED patients with undifferentiated dyspnea, levels 1-3 studies,
    total N varies by finding (contributing study count noted per finding, not
    pooled patient N, which the paper does not report as a single figure).

