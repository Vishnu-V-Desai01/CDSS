  notes: >
    Prospective, 7-center, N=1538 (of 1586 screened). Consecutive ED patients
    with primary complaint of dyspnea -- genuinely undifferentiated population,
    NOT pre-selected for suspected CHF. Final CHF prevalence 722/1538 (46.9%).
