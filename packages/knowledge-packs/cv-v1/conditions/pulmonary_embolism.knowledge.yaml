priors:
  ED_UNDIFFERENTIATED_CHEST_PAIN:
    weight: 0.069
    citation_id: KLINE_2008
    population: >
      Suspected-PE ED cohort, N=8138, 13 US/NZ sites (Kline 2008). NOT a fully
      undifferentiated chest-pain/dyspnea population — patients were already
      selected for PE workup. Closest available match to this care-setting
      category. See EXTRACTION_NOTES.md, "Denominator problem."
    verification_status: unverified

dependency_groups:
  - group_id: CLINICAL_PRETEST_SCORES
    redundancy_lambda: 0.15
    rationale: >
      PERC, Wells (both forms), Revised Geneva, and Simplified Geneva draw on
      substantially overlapping clinical variables (heart rate, immobilization/
      surgery, prior VTE, leg findings, hormone use). Not independent evidence —
      heavy discount reflects near-total informational overlap. Structural
      judgment call, not literature-derived; pending clinical lead review.

