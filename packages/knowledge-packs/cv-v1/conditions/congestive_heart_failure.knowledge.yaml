disposition_guidance: >
  PROVISIONAL -- pending clinical lead review. High clinical suspicion and/or
  elevated BNP should prompt CXR/ECG correlation and consideration of
  echocardiography. BNP <100 pg/mL is the single most useful individual test
  for excluding CHF per Wang 2005. Hemodynamically unstable presentations
  bypass stepwise workup via the red-flag gate (red-flags.json -- not yet
  built, separate Chat 1 deliverable).

