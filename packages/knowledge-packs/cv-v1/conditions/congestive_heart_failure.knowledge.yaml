priors:
  ED_UNDIFFERENTIATED_CHEST_PAIN:
    weight: 0.469
    citation_id: MCCULLOUGH_2002
    population: >
      Consecutive ED patients with primary complaint of dyspnea, N=1538, 7
      international centers (Breathing Not Properly Multinational Study).
      Genuinely undifferentiated dyspnea population -- NOT pre-selected for
      suspected CHF. NOTE: the enum key "ED_UNDIFFERENTIATED_CHEST_PAIN" is
      a fixed care-setting category from the pack schema and is applied here
      as the closest available match; McCullough 2002's actual inclusion
      criterion was dyspnea, not chest pain specifically. See
      EXTRACTION_NOTES.md.
    verification_status: unverified

dependency_groups:
  - group_id: DYSPNEA_SYMPTOM_CLUSTER
    redundancy_lambda: 0.3
    rationale: >
      Paroxysmal nocturnal dyspnea, orthopnea, and dyspnea on exertion all
      reflect the same underlying mechanism and are highly correlated
      patient-reported symptoms. Not independent evidence.
  - group_id: CONGESTION_SIGN_CLUSTER
    redundancy_lambda: 0.25
    rationale: >
      JVD, rales, lower extremity edema, cardiomegaly, and the three CXR
      congestion findings all reflect the same underlying volume-overload
      state. S3 gallop deliberately excluded -- distinct mechanism, best
      individual predictor. Judgment call, not literature-derived.
  - group_id: ISCHEMIC_HISTORY_CLUSTER
    redundancy_lambda: 0.4
    rationale: >
      Prior MI and prior CAD history frequently co-occur. Prior CHF history
      kept independent as a more direct/specific predictor.
  - group_id: ECG_FINDINGS_CLUSTER
    redundancy_lambda: 0.2
    rationale: >
      "Any abnormal ECG finding" likely contains atrial fibrillation and new
      T-wave changes as components. Heavy discount reflects likely
      containment, not just correlation.

