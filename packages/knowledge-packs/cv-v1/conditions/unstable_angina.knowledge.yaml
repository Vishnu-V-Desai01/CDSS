disposition_guidance: >
  PROVISIONAL -- pending clinical lead review and further sourcing (see prior
  probability caveat above). Findings drawn from a meta-analysis of ACS
  (AMI+UA combined) diagnostic accuracy, not UA specifically. Troponin,
  ECG findings, and TIMI/HEART risk-score features remain unsourced pending
  access to non-paywalled primary literature. Hemodynamically unstable
  presentations bypass stepwise workup via the red-flag gate (red-flags.json
  -- not yet built).

