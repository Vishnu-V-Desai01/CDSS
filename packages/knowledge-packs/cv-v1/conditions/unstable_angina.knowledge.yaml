priors:
  ED_UNDIFFERENTIATED_CHEST_PAIN:
    weight: 0.263
    citation_id: BRUYNINCKX_2008
    population: >
      PROVISIONAL / FLAGGED -- see open decision in EXTRACTION_NOTES.
      This weight is Bruyninckx 2008's pooled prevalence of ACS (=AMI+UA
      combined), 4594/17416 (26.3%), across combined selected+non-selected
      populations (a clean non-selected-only prevalence figure was not
      separately reported for ACS). No source located (Goodacre 2003
      QJM -- paywalled -- was the best candidate for a genuine UA-isolated,
      undifferentiated-population prevalence figure and could not be
      accessed) that isolates unstable-angina-specific incident prevalence
      from an undifferentiated chest-pain population. Using ACS-composite
      prevalence as a stand-in likely OVERESTIMATES the true UA-specific
      prior, since it includes AMI patients who are out of scope for this
      condition_id. This is the single most urgent open sourcing gap for
      this file.
    verification_status: unverified

dependency_groups:
  - group_id: RADIATION_SITE_CLUSTER
    redundancy_lambda: 0.35
    rationale: >
      Pain radiating to the right arm/shoulder and pain radiating to the
      neck both reflect the same underlying referred-pain mechanism and
      commonly co-occur with other radiation patterns; treating each site
      as fully independent evidence would overweight a single radiating-pain
      episode reported across multiple sites.

