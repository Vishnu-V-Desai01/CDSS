disposition_guidance: >
  Acute pericarditis diagnosis relies heavily on clinical presentation (pleuritic
  chest pain worsening supine, relieved by leaning forward) + ECG findings
  (diffuse ST elevation, PR depression) + elevated inflammatory markers (CRP, ESR).
  Echocardiography/CT/CMR confirms pericardial involvement. Troponin elevation
  can occur with myopericarditis, causing overlap with UA. Hemodynamically unstable
  (tamponade) presentations are red-flag conditions managed outside stepwise workup.

