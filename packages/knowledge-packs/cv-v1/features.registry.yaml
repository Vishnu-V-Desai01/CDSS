  prompt: "Are all vital signs (HR, BP, RR, SpO2) normal?"
  tier: BEDSIDE
  dependency_group: null
  state_values: [PRESENT, ABSENT]
  # Red-flag features (RF-01..RF-05) — structural, not literature-sourced.
# These are acute danger signs, not differential-diagnosis findings, so they
# carry no dependency_group (they never participate in the LR redundancy
# discount) and are never referenced inside any condition file's features list.

